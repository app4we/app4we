<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>App4We — Coming Soon</title>
  <meta name="description" content="App4We — Technology made simpler. Something new is coming soon.">
  <meta name="theme-color" content="#070b16">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      background: #070b16;
      color: #ffffff;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      width: 650px;
      height: 650px;
      top: -300px;
      left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(
        circle,
        rgba(73, 109, 255, 0.20) 0%,
        rgba(73, 109, 255, 0.07) 38%,
        transparent 70%
      );
      pointer-events: none;
      z-index: -1;
    }

    body::after {
      content: "";
      position: fixed;
      width: 500px;
      height: 500px;
      bottom: -280px;
      right: -180px;
      background: radial-gradient(
        circle,
        rgba(0, 200, 255, 0.10) 0%,
        transparent 70%
      );
      pointer-events: none;
      z-index: -1;
    }

    nav {
      width: 100%;
      padding: 28px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #ffffff;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667cff, #35c9ff);
      font-size: 22px;
      font-weight: 800;
      box-shadow: 0 8px 30px rgba(73, 109, 255, 0.25);
    }

    .brand-name {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand-name span {
      color: #6d8cff;
    }

    .nav-status {
      font-size: 13px;
      color: #9ca8c5;
      padding: 8px 15px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 30px;
      background: rgba(255,255,255,0.03);
    }

    .nav-status::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #43e58c;
      border-radius: 50%;
      margin-right: 7px;
      box-shadow: 0 0 10px #43e58c;
    }

    .hero {
      min-height: calc(100vh - 98px);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 50px 20px 100px;
    }

    .hero-content {
      max-width: 900px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 17px;
      border-radius: 50px;
      border: 1px solid rgba(111, 140, 255, 0.25);
      background: rgba(111, 140, 255, 0.07);
      color: #9eb0ff;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      margin-bottom: 28px;
    }

    .eyebrow-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #6d8cff;
      box-shadow: 0 0 12px #6d8cff;
    }

    h1 {
      font-size: clamp(56px, 10vw, 112px);
      line-height: 0.95;
      letter-spacing: -6px;
      font-weight: 800;
      margin-bottom: 30px;
    }

    h1 .gradient {
      background: linear-gradient(
        100deg,
        #ffffff 10%,
        #9aabff 45%,
        #47cfff 90%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-text {
      max-width: 650px;
      margin: 0 auto;
      color: #9da8bf;
      font-size: 19px;
      line-height: 1.7;
    }

    .hero-text strong {
      color: #e8ecf7;
      font-weight: 600;
    }

    .coming-soon {
      margin: 42px auto 0;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      color: #dce3f5;
      font-size: 14px;
      font-weight: 600;
    }

    .loading {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #6d8cff;
      box-shadow: 0 0 15px #6d8cff;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.35;
        transform: scale(0.8);
      }
      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    footer {
      border-top: 1px solid rgba(255,255,255,0.06);
      padding: 25px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #667088;
      font-size: 12px;
    }

    footer a {
      color: #8998bd;
      text-decoration: none;
    }

    footer a:hover {
      color: #ffffff;
    }

    @media (max-width: 700px) {
      nav {
        padding: 22px 20px;
      }

      .nav-status {
        display: none;
      }

      .hero {
        min-height: calc(100vh - 80px);
        padding: 40px 20px 80px;
      }

      h1 {
        font-size: 58px;
        letter-spacing: -3px;
      }

      .hero-text {
        font-size: 16px;
      }

      footer {
        padding: 22px 20px;
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <nav>
    <a href="/" class="brand" aria-label="App4We home">
      <div class="brand-mark">4</div>
      <div class="brand-name">App<span>4</span>We</div>
    </a>

    <div class="nav-status">Something new is coming</div>
  </nav>

  <main>
    <section class="hero">
      <div class="hero-content">

        <div class="eyebrow">
          <span class="eyebrow-dot"></span>
          A new technology company
        </div>

        <h1>
          Building <span class="gradient">what's next.</span>
        </h1>

        <p class="hero-text">
          We're working on something <strong>new, useful and exciting.</strong>
          Our website is currently under development.
        </p>

        <div class="coming-soon">
          <span class="loading"></span>
          Coming Soon
        </div>

      </div>
    </section>
  </main>

  <footer>
    <div>
      © <span id="year"></span> App4We. All rights reserved.
    </div>

    <div>
      <a href="mailto:hello@app4we.com">hello@app4we.com</a>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
